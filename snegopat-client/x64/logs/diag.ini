; Диагностика Снегопата. Файл перечитывается раз в 2 секунды, перезапуск 1С не нужен.
; Строка с «;» в начале закомментирована, параметр действует как по умолчанию.
; Чтобы включить параметр, уберите «;» в начале строки. Комментарий в одной строке со значением писать нельзя.
; Если после изменения ошибка пропала или появилась, укажите в обращении, какой параметр вы меняли.

; Подробный журнал работы в x64\logs. По умолчанию включён, нужен для разбора ошибок.
; Значения: on, off. По умолчанию: on.
trace=on

; Свой список подсказки Снегопата (Ctrl+Пробел). При значении off работает штатный список платформы.
; Нужен для проверки: если ошибка при вызове подсказки пропала, причина в перехвате списка.
; Значения: on, off. По умолчанию: on.
;hook.list=off

; Проверка «список устарел» при быстром наборе: список запрашивается заново, если курсор сдвинулся.
; При значении off список показывается без этой проверки.
; Значения: on, off. По умолчанию: on.
;hook.liststale=off

; Перехват цветов текстового редактора: раскраска запросов в строках, сворачивание комментариев //{ //} и длинных строк.
; Значения: on, off. По умолчанию: on на платформах 8.3.17.x и 8.3.27.x (x64), на остальных off.
; Если на вашей версии платформы не работает раскраска, добавьте строку hook.colors=on и перезапустите Конфигуратор.
;hook.colors=on

; Заливка фона многострочных строк запроса до правого края на платформе 8.3.27 (на 17 работает штатно).
; Значения: on, off. По умолчанию: on на 8.3.27.1859, на остальных сборках 8.3.27 off. Если на вашей сборке фон только под текстом,
; добавьте строку hook.linebg=on и перезапустите Конфигуратор; если после этого падает, верните off и пришлите журнал.
;hook.linebg=on
