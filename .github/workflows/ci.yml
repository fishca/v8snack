# CI: тесты + релиз.
#
# Тесты выполняются на Windows (compile-тесты гоняют нативный coreas_runner_c.exe
# из сборки; addins проверяются node --check).
#
# Релиз выпускается только после зелёных тестов и только для тега вида v<версия>
# (например v1.6.40): тег сверяется с полем ours в snegopat-client/x64/version.json,
# упаковывается snegopat-client, ассет заливается в GitHub Release.
#
# Триггеры: push в main / PR в main / тег v* / ручной запуск (workflow_dispatch).

name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

# Токен по умолчанию: чтение; создание релиза требует contents: write
permissions:
  contents: read

jobs:
  test:
    name: Тесты (Windows)
    runs-on: windows-latest
    steps:
      - name: Проверка кода
        # LF гарантирует .gitattributes (* text=auto eol=lf) — перекрывает autocrlf
        uses: actions/checkout@v4

      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Зависимости dump-tools
        run: python -m pip install capstone pefile numpy

      - name: Запуск тестов (включая компиляцию модуля под версии платформы)
        run: python -m unittest discover -s tests -v

      - name: Тег соответствует version.json
        if: startsWith(github.ref, 'refs/tags/v')
        run: python .github/scripts/check_version.py ${{ github.ref_name }}

  release:
    name: Релиз
    needs: test
    # только тег v* на push; тесты обязаны пройти (needs)
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: windows-latest
    permissions:
      contents: write   # создание релиза и заливка ассета
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Проверка кода
        uses: actions/checkout@v4

      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Упаковать snegopat-client
        run: |
          $ver = "${{ github.ref_name }}".TrimStart('v')
          python .github/scripts/package.py snegopat-client "snegopat-client-$ver-x64.zip"

      - name: Создать релиз
        run: |
          $tag = "${{ github.ref_name }}"
          $ver = $tag.TrimStart('v')
          gh release create $tag "snegopat-client-$ver-x64.zip" --title "v8snack $ver" --generate-notes